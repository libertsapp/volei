<!doctype html>
<!-- Modelo da imagem de prévia do link (WhatsApp, Instagram, Telegram), 1200×630. Não vai pro ar: é aberto no Chrome
     headless e vira PNG. Parâmetros na URL: ?titulo=&frase=&endereco=&selo=&cor=&cor2=&cor3= (cor3 = gomos da bola)
     Gerar (Git Bash, na raiz do repo):
       "/c/Program Files/Google/Chrome/Application/chrome.exe" --headless=new --hide-scrollbars --force-device-scale-factor=1 \
         --virtual-time-budget=4000 --window-size=1200,630 --screenshot="C:\...\og-terca.png" \
         "file:///C:/.../scripts/og-imagem.html?endereco=memberstars.com/volei" -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{ --cor:#ffd700; --cor2:#00f3ff; --cor3:#4d7cff; }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:1200px;height:630px;overflow:hidden;}
  body{
    font-family:'Work Sans',sans-serif;color:#f4f1e6;
    background:
      radial-gradient(900px 500px at 85% 15%, color-mix(in srgb, var(--cor2) 22%, transparent), transparent 60%),
      radial-gradient(700px 500px at 10% 100%, color-mix(in srgb, var(--cor) 16%, transparent), transparent 60%),
      linear-gradient(135deg,#0b1530 0%,#101b33 55%,#17233f 100%);
    position:relative;
  }
  /* linhas da quadra, bem discretas */
  .quadra{position:absolute;inset:60px 60px 60px 640px;border:3px solid rgba(244,241,230,.08);border-radius:6px;}
  .quadra::before{content:'';position:absolute;top:0;bottom:0;left:50%;border-left:3px solid rgba(244,241,230,.08);}
  .quadra::after{content:'';position:absolute;top:0;bottom:0;left:22%;right:22%;border-left:2px dashed rgba(244,241,230,.06);border-right:2px dashed rgba(244,241,230,.06);}
  .bola{position:absolute;right:130px;top:155px;filter:drop-shadow(0 22px 40px rgba(0,0,0,.5));transform:rotate(-12deg);}
  .conteudo{position:absolute;left:80px;top:0;bottom:0;width:640px;display:flex;flex-direction:column;justify-content:center;}
  .selo{display:inline-flex;align-self:flex-start;gap:10px;align-items:center;font-weight:600;font-size:22px;letter-spacing:.08em;text-transform:uppercase;color:var(--cor);margin-bottom:26px;}
  .selo::before{content:'';width:34px;height:4px;border-radius:2px;background:var(--cor);}
  h1{font-family:'Anton',sans-serif;font-weight:400;font-size:112px;line-height:1.02;letter-spacing:.01em;text-transform:uppercase;}
  p{font-size:32px;line-height:1.35;color:#b9c0d6;margin-top:24px;max-width:600px;}
  .endereco{position:absolute;left:80px;bottom:54px;font-size:24px;font-weight:600;color:#f4f1e6;opacity:.85;}
  .endereco span{color:var(--cor);}
</style>
</head>
<body>
  <div class="quadra"></div>
  <!-- bola desenhada (o emoji sai preto e branco no Chrome do Windows); as cores seguem --cor e --cor2 -->
  <svg class="bola" viewBox="0 0 200 200" width="320" height="320" aria-hidden="true">
    <defs><clipPath id="dentro"><circle cx="100" cy="100" r="92"/></clipPath></defs>
    <circle cx="100" cy="100" r="92" fill="var(--cor)"/>
    <g clip-path="url(#dentro)">
      <path d="M100 100 C 98 62 122 30 168 22 L 210 10 L 210 120 C 168 128 128 122 100 100 Z" fill="var(--cor3)"/>
      <path d="M100 100 C 70 118 52 150 52 198 L -10 210 L -10 120 C 30 100 70 92 100 100 Z" fill="var(--cor3)"/>
      <g fill="none" stroke="#0b1530" stroke-width="5" stroke-linecap="round">
        <path d="M100 100 C 98 62 122 30 168 22"/>
        <path d="M100 100 C 128 122 168 128 210 120"/>
        <path d="M100 100 C 70 118 52 150 52 198"/>
        <path d="M100 100 C 70 92 30 100 -10 120"/>
        <path d="M100 100 C 112 140 140 168 180 178"/>
        <path d="M100 100 C 80 64 46 44 8 44"/>
      </g>
    </g>
    <circle cx="100" cy="100" r="92" fill="none" stroke="#0b1530" stroke-width="6"/>
    <ellipse cx="70" cy="60" rx="34" ry="18" fill="#fff" opacity=".22" transform="rotate(-30 70 60)"/>
  </svg>
  <div class="conteudo">
    <div class="selo" id="selo">App do grupo</div>
    <h1 id="titulo">Vôlei de Terça</h1>
    <p id="frase">Confirme presença, veja os times do dia, o ranking e quem foi o craque da rodada.</p>
  </div>
  <div class="endereco" id="endereco"></div>
<script>
  const q = new URLSearchParams(location.search);
  const por = (id, chave)=>{ if(q.get(chave)) document.getElementById(id).textContent = q.get(chave); };
  por('titulo', 'titulo'); por('frase', 'frase'); por('selo', 'selo');
  if(q.get('endereco')) document.getElementById('endereco').innerHTML = '<span>↗</span> ' + q.get('endereco').replace(/[<>&]/g, '');
  if(q.get('cor')) document.documentElement.style.setProperty('--cor', q.get('cor'));
  if(q.get('cor2')) document.documentElement.style.setProperty('--cor2', q.get('cor2'));
  if(q.get('cor3')) document.documentElement.style.setProperty('--cor3', q.get('cor3'));
</script>
</body>
</html>
